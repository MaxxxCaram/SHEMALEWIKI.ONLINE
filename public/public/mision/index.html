<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Control — Hermes Swarm</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --accent: #a78bfa;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #e2e8f0;
    --muted: #64748b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    padding: 20px;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 20px;
  }
  .header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
  .header h1 span { color: var(--accent); }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
  .status-dot.offline { background: var(--red); }
  .status-dot.standby { background: var(--yellow); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .metrics {
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .metric {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 16px; font-size: 0.85rem; min-width: 100px; text-align: center;
  }
  .metric .val { font-size: 1.5rem; font-weight: 700; }
  .metric .lbl { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px; margin-bottom: 20px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px;
  }
  .card h3 { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .worker-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .worker-row:last-child { border-bottom: none; }
  .worker-name { font-weight: 600; font-size: 0.9rem; }
  .worker-task { font-size: 0.75rem; color: var(--muted); }
  .worker-status { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; }
  .worker-status.active { background: rgba(74,222,128,0.15); color: var(--green); }
  .worker-status.standby { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 8px; font-weight: 600; }
  .badge.high { background: rgba(248,113,113,0.2); color: var(--red); }
  .badge.medium { background: rgba(251,191,36,0.2); color: var(--yellow); }
  .badge.critical { background: rgba(248,113,113,0.3); color: #fff; animation: pulse 1.5s infinite; }
  .kanban-col { min-width: 200px; }
  .kanban-col h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .kanban-col.done h4 { color: var(--green); }
  .kanban-col.progress h4 { color: var(--yellow); }
  .kanban-col.todo h4 { color: var(--muted); }
  .kanban-card {
    background: rgba(30,30,46,0.6); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 0.8rem;
  }
  .kanban-card .worker-tag { font-size: 0.65rem; color: var(--accent); }
  .health-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
  .health-item {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 6px; font-size: 0.78rem;
    background: rgba(30,30,46,0.5); border: 1px solid var(--border);
  }
  .health-ok { color: var(--green); }
  .health-fail { color: var(--red); border-color: rgba(248,113,113,0.3); }
  .refresh { font-size: 0.7rem; color: var(--muted); }
  .kanban-board { display: flex; gap: 16px; overflow-x: auto; }
  @media (max-width: 600px) {
    .header { flex-direction: column; gap: 12px; }
    .metrics { justify-content: center; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🧠 <span>Mission Control</span> — Hermes Swarm</h1>
    <div style="font-size:0.75rem;color:var(--muted);margin-top:4px;">
      <span class="status-dot online"></span> Sistema activo · <span id="uptime">--</span>
    </div>
  </div>
  <div class="metrics">
    <div class="metric"><div class="val" id="m-completed">--</div><div class="lbl">Completadas</div></div>
    <div class="metric"><div class="val" id="m-pending">--</div><div class="lbl">Pendientes</div></div>
    <div class="metric"><div class="val" id="m-alerts" style="color:var(--green)">0</div><div class="lbl">Alertas</div></div>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h3>🤖 Workers</h3>
    <div id="workers"></div>
  </div>
  <div class="card">
    <h3>💚 Health Checks</h3>
    <div class="health-grid" id="health"></div>
    <div class="refresh" style="margin-top:8px;">⏱ Actualización: <span id="last-update">--</span></div>
  </div>
</div>

<div class="card" style="margin-bottom:20px;">
  <h3>📋 Kanban Board</h3>
  <div class="kanban-board" id="kanban"></div>
</div>

<script>
const SUPABASE_URL = 'https://qtuzpswxzengqoqqwtpt.supabase.co';
const STATUS_URL = `${SUPABASE_URL}/storage/v1/object/public/swarm-data/status.json`;

async function fetchStatus() {
  try {
    const r = await fetch(STATUS_URL);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch(e) {
    console.error('Fetch error:', e);
    return null;
  }
}

const WORKER_ICONS = {
  'swarm-sentinel': '🛡️',
  'swarm-engineer': '🔧',
  'swarm-scout': '🔍',
  'swarm-outreach': '📨'
};

function renderWorkers(workers) {
  let html = '';
  for (const [id, w] of Object.entries(workers)) {
    const icon = WORKER_ICONS[id] || '🤖';
    html += `
      <div class="worker-row">
        <div>
          <div class="worker-name">${icon} ${id.replace('swarm-','').toUpperCase()}</div>
          <div class="worker-task">${w.current_task}</div>
        </div>
        <div>
          <span class="worker-status ${w.status}">${w.status === 'active' ? 'ACTIVO' : 'STANDBY'}</span>
          ${w.alerts > 0 ? `<span style="color:var(--red);font-size:0.7rem;margin-left:6px;">⚠${w.alerts}</span>` : ''}
        </div>
      </div>`;
  }
  document.getElementById('workers').innerHTML = html;
}

function renderHealth(health) {
  let html = '';
  for (const [key, val] of Object.entries(health)) {
    const ok = String(val).startsWith('OK');
    const cls = ok ? 'health-ok' : 'health-fail';
    const label = key.replace(/_/g, ' ');
    const detail = String(val).replace('OK ', '');
    html += `<div class="health-item ${cls}">
      <span>${ok ? '✅' : '❌'}</span>
      <span><strong>${label}</strong>${detail ? `<br><small>${detail}</small>` : ''}</span>
    </div>`;
  }
  document.getElementById('health').innerHTML = html;
}

function renderKanban(tasks) {
  const cols = { done: [], in_progress: [], todo: [] };
  for (const t of tasks) {
    const s = t.status === 'in_progress' ? 'in_progress' : t.status;
    if (cols[s]) cols[s].push(t);
    else cols.todo.push(t);
  }
  
  let html = '';
  const colDefs = [
    { key: 'todo', label: '📥 TO DO', cls: 'todo' },
    { key: 'in_progress', label: '⚡ IN PROGRESS', cls: 'progress' },
    { key: 'done', label: '✅ DONE', cls: 'done' }
  ];
  
  for (const col of colDefs) {
    html += `<div class="kanban-col ${col.cls}"><h4>${col.label}</h4>`;
    for (const t of (cols[col.key] || [])) {
      html += `<div class="kanban-card">
        <span class="badge ${t.priority}">${t.priority.toUpperCase()}</span>
        ${t.title}
        <div class="worker-tag">${WORKER_ICONS[t.worker] || ''} ${t.worker}</div>
      </div>`;
    }
    html += '</div>';
  }
  document.getElementById('kanban').innerHTML = html;
}

async function refresh() {
  const data = await fetchStatus();
  if (!data) {
    document.getElementById('last-update').textContent = 'ERROR';
    return;
  }
  
  renderWorkers(data.workers);
  renderHealth(data.health);
  renderKanban(data.kanban);
  
  document.getElementById('uptime').textContent = data.system.uptime;
  document.getElementById('m-completed').textContent = data.system.tasks_completed;
  document.getElementById('m-pending').textContent = data.system.tasks_pending;
  const alertEl = document.getElementById('m-alerts');
  alertEl.textContent = data.system.alerts_active;
  alertEl.style.color = data.system.alerts_active > 0 ? 'var(--red)' : 'var(--green)';
  document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
