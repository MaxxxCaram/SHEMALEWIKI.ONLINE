services:
  hermes:
    image: node:20-alpine
    container_name: hermes_app
    working_dir: /app
    command: node server.js
    restart: always
    volumes:
      - ./server.js:/app/server.js
    ports:
      - "3000:3000"
    networks:
      - hermes_network

  mongodb:
    image: mongo:latest
    container_name: hermes_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: hermes123
    volumes:
      - hermes_mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - hermes_network

  redis:
    image: redis:latest
    container_name: hermes_redis
    restart: always
    command: redis-server --requirepass hermes456
    ports:
      - "6379:6379"
    networks:
      - hermes_network

  grafana:
    image: grafana/grafana:latest
    container_name: hermes_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: hermes789
      GF_SECURITY_ADMIN_USER: admin
    ports:
      - "3005:3000"
    networks:
      - hermes_network

volumes:
  hermes_mongodb_data:
  hermes_redis_data:

networks:
  hermes_network:
    driver: bridge
